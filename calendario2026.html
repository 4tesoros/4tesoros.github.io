<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roma - Calendario</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
font-family:system-ui;
background:linear-gradient(180deg,#f8f9fa,#eef1f5);
}

.navbar{
background:white;
border-bottom:1px solid #eee;
}

#login{
max-width:420px;
margin:60px auto;
padding:35px;
background:white;
border-radius:18px;
box-shadow:0 20px 50px rgba(0,0,0,.08);
}

.table-container{
background:white;
border-radius:18px;
padding:25px;
box-shadow:0 10px 30px rgba(0,0,0,.06);
overflow-x:auto;
}

table{
border-collapse:separate;
border-spacing:0 6px;
width:100%;
}

th{
background:#0d6efd !important;
color:white;
padding:14px !important;
}

td{
padding:12px !important;
transition:.15s;
}

.libre{
background:#e8f5e9 !important;
color:#198754;
cursor:pointer;
}

.libre:hover{
transform:scale(1.02);
background:#d7f3da !important;
}

.ocupado{
background:#fde8ea !important;
color:#dc3545;
transform:scale(1.01);
cursor:pointer;
}

.info-panel{
background:white;
padding:16px;
border-radius:12px;
margin-bottom:15px;
}

@media(max-width:768px){

table{font-size:13px}

th,td{
padding:7px !important;
}

}

</style>
</head>

<body>

<div class="container">

<div id="login">

<h3 class="mb-3">Ingresar</h3>

<input id="usuario" class="form-control mb-2" placeholder="usuario">
<input id="clave" type="password" class="form-control mb-3" placeholder="clave">

<button id="btnLogin" class="btn btn-primary w-100">
Entrar
</button>

</div>

<div id="appContent" style="display:none">

<div class="info-panel d-flex justify-content-between align-items-center">

<div>
<input type="date" id="fecha">
</div>

<div>

<b id="horasTotales"></b><br>
<small id="ocupacionDia"></small>

</div>

</div>

<div class="table-container">

<table class="table text-center" id="calendario"></table>

</div>

</div>

</div>


<!-- modal crear -->

<div id="modalCrear" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); align-items:center; justify-content:center;">

<div style="background:white;padding:30px;border-radius:14px;width:350px">

<h4>Nueva reserva</h4>

<input id="telefono" class="form-control mb-2" placeholder="telefono">

<textarea id="obs" class="form-control mb-3" placeholder="observaciones"></textarea>

<button id="guardarReserva" class="btn btn-primary w-100">Guardar</button>

</div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, query, where, onSnapshot, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyDoTNjnjkkgUBDaVI2To5ScA83_q6ZMy-s",
authDomain:"gamers-a1763.firebaseapp.com",
projectId:"gamers-a1763",
storageBucket:"gamers-a1763.appspot.com",
messagingSenderId:"279036766390",
appId:"1:279036766390:web:e67ce235630f444d0f5e17"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const usuarios={
proclub:{clave:"1226",horasDisponibles:16},
holistica_lu:{clave:"j56",horasDisponibles:32},
nutri_jesica:{clave:"j456",horasDisponibles:1},
nutricionista:{clave:"g456",horasDisponibles:32},
lic_noi:{clave:"g456",horasDisponibles:132},
lic_carla:{clave:"156",horasDisponibles:24}
};

let usuarioLogueado=null;
let unsubscribeReservas=null;

const horarios=["09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00"];

const calendario=document.getElementById("calendario");
const fechaInput=document.getElementById("fecha");

document.getElementById("btnLogin").onclick=()=>{

const u=document.getElementById("usuario").value.toLowerCase();
const p=document.getElementById("clave").value;

if(usuarios[u] && usuarios[u].clave===p){

usuarioLogueado=u;

login.style.display="none";
appContent.style.display="block";

const hoy=new Date().toISOString().split("T")[0];
fechaInput.value=hoy;

actualizarCalendario();
calcularHorasTotales();

}
};

fechaInput.addEventListener("change",actualizarCalendario);

function actualizarCalendario(){

const fecha=fechaInput.value;

calendario.innerHTML=`
<thead>
<tr>
<th>Hora</th>
<th>Recepción</th>
<th>Ofi 1</th>
<th>Ofi 2</th>
<th>Ofi 3</th>
</tr>
</thead>
<tbody id="cuerpo"></tbody>
`;

const cuerpo=document.getElementById("cuerpo");

horarios.forEach(h=>{

const fila=document.createElement("tr");

fila.innerHTML=`<td>${h}</td>`;

for(let i=1;i<=4;i++){

const c=document.createElement("td");

c.className="libre";
c.textContent="Libre";
c.dataset.hora=h;
c.dataset.oficina="oficina"+i;

c.onclick=gestionarReserva;

fila.appendChild(c);
}

cuerpo.appendChild(fila);

});

cargarReservas(fecha);

}

function cargarReservas(fecha){

if(unsubscribeReservas) unsubscribeReservas();

const q=query(collection(db,"reservas"),where("fecha","==",fecha));

unsubscribeReservas=onSnapshot(q,(snapshot)=>{

document.querySelectorAll("td[data-hora]").forEach(c=>{

c.className="libre";
c.textContent="Libre";
delete c.dataset.id;

});

snapshot.forEach(d=>{

const data=d.data();

const celda=document.querySelector(`td[data-hora="${data.hora}"][data-oficina="${data.oficina}"]`);

if(celda){

celda.className="ocupado";
celda.textContent=data.cliente.replace("_"," ");
celda.dataset.id=d.id;

}

});

actualizarOcupacion(snapshot);

});

}

function actualizarOcupacion(snapshot){

let total=snapshot.size;

document.getElementById("ocupacionDia").innerText=
"Ocupación del día: "+total+" turnos";

}

async function gestionarReserva(e){

const celda=e.target;

const fecha=fechaInput.value;
const hora=celda.dataset.hora;
const oficina=celda.dataset.oficina;

if(celda.classList.contains("libre")){

const q=query(
collection(db,"reservas"),
where("fecha","==",fecha),
where("hora","==",hora),
where("oficina","==",oficina)
);

const ex=await getDocs(q);

if(!ex.empty){

alert("Ese turno ya fue reservado");
return;

}

celdaSeleccionada={fecha,hora,oficina};

modalCrear.style.display="flex";

}

}

let celdaSeleccionada=null;

guardarReserva.onclick=async()=>{

if(!celdaSeleccionada) return;

await addDoc(collection(db,"reservas"),{

...celdaSeleccionada,
cliente:usuarioLogueado,
telefono:telefono.value,
observaciones:obs.value

});

modalCrear.style.display="none";

telefono.value="";
obs.value="";

};

async function calcularHorasTotales(){

const q=query(
collection(db,"reservas"),
where("cliente","==",usuarioLogueado)
);

const snap=await getDocs(q);

let total=0;

snap.forEach(d=>{

const data=d.data();

if(data.fecha.startsWith(new Date().getFullYear().toString())){
total++;
}

});

const disp=usuarios[usuarioLogueado].horasDisponibles;

horasTotales.innerText=
"Horas usadas "+total+" / "+disp;

}

</script>

</body>
</html>
